# Calculadoras e ferramentas interativas.
# tipo: shinylive (app R/Shiny que roda no navegador, sem servidor)
#       js        (componente próprio do site)
#       externo   (link para outro site)
# Os códigos-fonte R ficam em /ferramentas-shiny/<id>/app.R
# e são exportados com shinylive para /public/ferramentas/<id>/

- id: calculadora-colostro
  nome: Calculadora de Colostro
  descricao: Volume de colostro a fornecer a partir do peso da bezerra e da leitura no refratômetro Brix.
  tipo: js
  status: em-desenvolvimento

- id: explorador-pastagens
  nome: Explorador de Pastagens
  descricao: Compare espécies forrageiras por clima, solo e uso.
  tipo: shinylive
  src: /ferramentas/explorador-pastagens/
  status: planejada

- id: planejador-prv
  nome: Planejador de Pastoreio Racional
  descricao: Calcule número de piquetes, período de ocupação e descanso.
  tipo: shinylive
  src: /ferramentas/planejador-prv/
  status: planejada

- id: indice-transicao
  nome: Índice de Transição Agroecológica
  descricao: Autoavaliação do grau de transição agroecológica da propriedade.
  tipo: shinylive
  src: /ferramentas/indice-transicao/
  status: planejada

- id: autoavaliacao-saude-solo
  nome: Autoavaliação da Saúde do Solo
  descricao: Questionário guiado de campo para avaliar a saúde do solo da propriedade.
  tipo: shinylive
  src: /ferramentas/autoavaliacao-saude-solo/
  status: planejada

- id: painel-saude-solo
  nome: Painel de Saúde do Solo
  descricao: Acompanhe indicadores de saúde do solo ao longo do tempo.
  tipo: shinylive
  src: /ferramentas/painel-saude-solo/
  status: planejada

- id: simulador-impacto
  nome: Simulador de Impacto do Pastoreio
  descricao: Modelo simples do efeito da lotação e do descanso sobre a pastagem.
  tipo: shinylive
  src: /ferramentas/simulador-impacto/
  status: planejada

- id: bem-estar-bezerras
  nome: Escore de Bem-Estar de Bezerras
  descricao: Avaliação do bem-estar das bezerras por indicadores de manejo, saúde e comportamento.
  tipo: shinylive
  src: /ferramentas/bem-estar-bezerras/
  status: planejada

- id: calculadora-emergia
  nome: Calculadora de Análise Emergética
  descricao: Indicadores emergéticos (ESI, EYR, ELR) da propriedade.
  tipo: shinylive
  src: /ferramentas/calculadora-emergia/
  status: planejada
